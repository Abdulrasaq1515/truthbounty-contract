---
name: Symbolic Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-security-check:
    name: Critical-path symbolic analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Python toolchain
        run: |
          python3 --version
          python3 -m pip --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Install dependency analyzers
        run: |
          python3 -m pip install --upgrade "pip==24.2"
          python3 -m pip install --require-hashes -r .github/requirements-symbolic.txt

      - name: Verify analyzer toolchain
        run: |
          python3 -c "import pkg_resources; print('setuptools', pkg_resources.get_distribution('setuptools').version)"
          python3 -m mythril --version
          slither --version

      - name: Install repo dependencies
        run: npm ci

      - name: Run bounded symbolic checks
        run: |
          set -o pipefail
          ./scripts/symbolic-check.sh --tool auto 2>&1 | tee symbolic-check.log

      - name: Upload symbolic analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-check-log
          path: symbolic-check.log
          if-no-files-found: warn
