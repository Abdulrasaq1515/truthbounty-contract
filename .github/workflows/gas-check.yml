name: Gas Regression Detection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  gas-report:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Check SC-064 scenario budgets and snapshot
        run: npm run check:gas:sc064
      - name: Check full-suite gas snapshot
        run: forge snapshot --check
      
      - name: Upload gas reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gas-reports
          path: |
            .gas-reports.json
            .gas-snapshots.json
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .gas-reports.json ]; then
            echo "## ⛽ Gas Report Generated" >> $GITHUB_STEP_SUMMARY
            echo "Gas reports have been generated for this PR." >> $GITHUB_STEP_SUMMARY
            echo "See artifacts for detailed gas consumption metrics." >> $GITHUB_STEP_SUMMARY
          fi
