name: Gas Regression Detection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  gas-report:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Compile contracts
        run: npm run compile
      
      - name: Run tests with gas reporting
        run: npm run test:gas
        continue-on-error: true
      
      - name: Compare gas snapshots
        run: |
          if [ ! -f .gas-snapshots.json ]; then
            echo "No gas snapshot file found. Skipping."
          elif git diff --quiet .gas-snapshots.json; then
            echo "✓ No gas regression detected"
          else
            echo "⚠ Gas changes detected:"
            git diff .gas-snapshots.json
          fi

      - name: Validate V2 gas budget config
        run: |
          if [ -f config/gas-budgets.json ]; then
            node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('config/gas-budgets.json','utf8')); if(!j.budgets||!j.bounds) { process.exit(1);} console.log('gas-budgets.json OK');"
          fi
      
      - name: Upload gas reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gas-reports
          path: |
            .gas-reports.json
            .gas-snapshots.json
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .gas-reports.json ]; then
            echo "## ⛽ Gas Report Generated" >> $GITHUB_STEP_SUMMARY
            echo "Gas reports have been generated for this PR." >> $GITHUB_STEP_SUMMARY
            echo "See artifacts for detailed gas consumption metrics." >> $GITHUB_STEP_SUMMARY
          fi
